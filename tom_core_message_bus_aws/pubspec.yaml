name: tom_core_message_bus_aws
description: >-
  The AWS adapter of the Tom message bus: TomMessageBus over Amazon SNS and
  SQS — an SNS topic per topic, an SQS queue per consumer group — through their
  HTTP APIs, signed with Signature Version 4. Passes the bus's conformance
  suite.
version: 0.1.0

repository: https://github.com/al-the-bear/tom_core_extensions
homepage: https://github.com/al-the-bear/tom_core_extensions/tree/main/tom_core_message_bus_aws

environment:
  sdk: ^3.10.0

dependencies:
  # The SHA-256 of a request body, for its signature.
  crypto: ^3.0.6
  # The HTTP requests to SNS and SQS.
  http: ^1.6.0
  # The contract this package implements, the trace helpers and the codec.
  tom_core_message_bus:
    path: ../../core/tom_core_message_bus
  # The exception base, the logging and the resilient HTTP client.
  tom_core_kernel:
    path: ../../core/tom_core_kernel
  # TomAwsV4Signer and TomAwsCredentialsSource.
  tom_core_server:
    path: ../../core/tom_core_server

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
