include: package:lints/recommended.yaml

linter:
  rules:
    # Every public member carries a doc comment; the lint makes `dart analyze`
    # the ratchet rather than a later coverage sweep.
    public_member_api_docs: true
    comment_references: true
analyzer:
  errors:
    # This package takes workspace packages by relative path, the workspace's
    # development mode (`_copilot_guidelines/dart/project_republishing.md`).
    # It reaches pub.dev from the staged copy `_bin/publishing/` builds, which
    # writes every path dependency as a version, so the analyzer's check that
    # a publishable package has no path dependency is answered there: the
    # staged copy's `dart pub publish --dry-run` refuses one that remains.
    invalid_dependency: ignore
