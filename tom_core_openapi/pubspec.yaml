name: tom_core_openapi
description: OpenAPI 3.1 for Tom servers — generates the document from the endpoint annotations and reflected DTOs, validates it, and generates a typed Dart client from it. A tom_build_base command-line tool.
version: 0.2.0

repository: https://github.com/al-the-bear/tom_core_extensions
homepage: https://github.com/al-the-bear/tom_core_extensions/tree/main/tom_core_openapi

environment:
  sdk: ^3.10.0

dependencies:
  path: ^1.9.0
  tom_build_base: ^2.16.1
  tom_core_kernel:
    path: ../../core/tom_core_kernel
  tom_core_server:
    path: ../../core/tom_core_server
dev_dependencies:
  build: ^4.0.3
  build_runner: ^2.10.4
  lints: ^6.0.0
  shelf: ^1.4.2
  test: ^1.25.6
  tom_reflection_generator:
    path: ../../reflection/tom_reflection_generator
executables:
  openapi:
